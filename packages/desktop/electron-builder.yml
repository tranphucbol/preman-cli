# How the four Vite bundles become an installable app. `bun run build` produces `dist/`;
# electron-builder only wraps it, so this file describes packing and never compilation.
appId: dev.preman.desktop
productName: preman

directories:
  # `dist/` is the build's output, not the packer's - pointing electron-builder at it would
  # have the packer overwrite its own input on the second run.
  output: release
  buildResources: resources

# The manifest's `dependencies` are exactly what the engine host externalises, so the default
# "pack dependencies, prune devDependencies" rule already ships the right node_modules; the
# renderer's packages are devDependencies because Vite inlines them into the bundle.
files:
  - dist/**

# Nothing the engine requires is a native module, so there is no addon to rebuild against
# Electron's ABI - and rebuilding would only walk a workspace it cannot own.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    # The DMG is the first install: it is what a browser downloads and what the release page
    # offers. The ZIP is the update payload, because the app's own updater extracts a bundle with
    # `ditto` and swaps it into place - a disk image would have to be mounted, and mounting one
    # unattended is a whole extra failure surface. Neither is Squirrel's format; preman does not
    # speak Squirrel, for the reason `docs/decisions/054` gives at length.
    - dmg
    - zip
  # Ad-hoc signing. A real identity belongs to whoever ships the build, not to the repository.
  # This is also what rules out Squirrel.Mac: it validates a downloaded bundle against the
  # designated requirement of the installed one, and two ad-hoc builds never share one.
  identity: null
