$kind: http-request
name: Signed Form
# Mirrors a real bank collection: the fields are authored as a map, and a
# pre-request script reads them back and signs them with CryptoJS.
url: "{{http_url}}/echo"
method: POST
body:
  type: urlencoded
  content:
    clientid: "11"
    note: "a+b/c="
    sig: ""
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: javascript
    code: |-
      const fields = _.pick(pm.request.body.urlencoded.toObject(), ["clientid", "note", "sig"]);

      pm.test("scripts see the authored fields, not the encoded string", function () {
        pm.expect(pm.request.body.mode).to.equal("urlencoded");
        pm.expect(fields.note).to.equal("a+b/c=");
        pm.expect(fields.sig).to.equal("");
      });

      const signature = CryptoJS.HmacSHA256(fields.clientid + "|" + fields.note, "fixture-secret").toString();
      pm.request.body.urlencoded.upsert("sig", signature);
      pm.request.headers.upsert("X-Signature", signature);
      pm.request.url.query.add("signed", "true");
  - type: afterResponse
    language: javascript
    code: |-
      pm.test("the form reached the server percent-encoded", function () {
       const sent = pm.response.json().body;
        pm.expect(pm.response.json().query.signed).to.equal("true");
        pm.expect(sent).to.contain("note=a%2Bb%2Fc%3D");
         pm.expect(sent).to.contain("sig=" + CryptoJS.HmacSHA256("11|a+b/c=", "fixture-secret").toString());
      });
order: 90
