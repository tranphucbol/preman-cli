$kind: grpc-request
name: Ping
url: "{{grpc_url}}"
methodPath: test.echo.EchoService.Ping
message:
  content: |-
    {
      "text": "ping"
    }
metadata:
  # Never sent. `Echo` covers the entries that are, so this one is here to prove the
  # disabled flag is honoured all the way onto the `request-sent` event.
  - key: x-disabled
    value: never sent
    disabled: true
settings: {}
schema:
  source: file
  location: ../../../src/main/proto/echo/echo.proto
scripts:
  - type: onMessage
    language: text/javascript
    code: |-
      pm.test("message echoes what we sent", function () {
          pm.expect(pm.message.data.echoed).to.equal("ping");
          pm.response.messages.to.include({ echoed: "ping" });
      });
order: 10
