<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The app's sans stack starts with ui-sans-serif and system-ui, which on Debian resolve to
  DejaVu Sans: wide, with a taller line box than San Francisco, so every row and control in the
  box would be a few pixels off what the app was designed at. Liberation Sans has Helvetica's
  metrics, the closest free match. The mono stack already names JetBrains Mono, which the image
  installs.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
